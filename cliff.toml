[bump]
initial_tag = "v0.1.0"
breaking_always_bump_major = false

[changelog]
header = ""
body = """
{% macro reference(commit, html=false) %}
{%- set label = "" %}{%- set url = "" %}
{%- if commit.remote.pr_number %}
{%- set label = "#" ~ commit.remote.pr_number %}{%- set url = "https://github.com/" ~ remote.github.owner ~ "/" ~ remote.github.repo ~ "/pull/" ~ commit.remote.pr_number %}
{%- elif commit.id %}
{%- set label = commit.id | truncate(length=7, end="") %}{%- set url = "https://github.com/" ~ remote.github.owner ~ "/" ~ remote.github.repo ~ "/commit/" ~ commit.id %}
{%- endif %}
{%- if label %}{% if html %}<a href="{{ url }}">{{ label }}</a>{% else %}[{{ label }}]({{ url }}){% endif %}{% endif %}
{%- endmacro reference %}
{% if commits | length > 0 %}
{% if version %}**[{{ version }}]**{% if timestamp %} · {{ timestamp | date(format="%B %e, %Y") }}{% endif %}
{% else %}**Unreleased**
{% endif %}

{% set_global attention = [] %}
{% for commit in commits | reverse %}
{% set reference = self::reference(commit=commit) %}
{% if commit.breaking_description %}
{% set_global attention = attention | concat(with="- **Breaking:** " ~ reference ~ " " ~ commit.breaking_description) %}
{% endif %}
{% for footer in commit.footers %}
{% if footer.token | lower in ["security", "deprecated"] %}
{% set label = footer.token | capitalize %}
{% set_global attention = attention | concat(with="- **" ~ label ~ ":** " ~ reference ~ " " ~ footer.value) %}
{% endif %}
{% endfor %}
{% endfor %}
{% if attention | length > 0 %}
### ⚠️ Attention

{% for item in attention %}{{ item | indent(prefix="  ", first=false) }}
{% endfor %}
{% endif %}

{% for group in ["Added", "Fixed", "Performance", "Documentation", "Other changes"] %}
{% set entries = commits | filter(attribute="group", value=group) %}
{% if entries | length > 0 %}
### {% if group == "Added" %}✨{% elif group == "Fixed" %}🐛{% elif group == "Performance" %}⚡{% elif group == "Documentation" %}📖{% else %}🔧{% endif %} {% if group == "Performance" %}Improved{% elif group == "Other changes" %}Maintenance{% else %}{{ group }}{% endif %}

{% for commit in entries | reverse %}
{% set message = commit.message %}
{% if commit.remote.pr_number %}
{% set message = message | trim_end_matches(pat=" (#" ~ commit.remote.pr_number ~ ")") %}
{% endif %}
{% set summary = commit.body | default(value="") | replace_regex(from="\\r\\n", to="\n") %}
{% set details = "" %}
{% if summary is starting_with("## Summary\n\n") %}
{% set sections = summary | trim_start_matches(pat="## Summary\n\n") | split(pat="\n\n## Details\n\n") %}
{% if sections | length <= 2 %}{% set summary = sections | first %}{% endif %}
{% if sections | length == 2 %}{% set details = sections | last %}{% endif %}
{% endif %}
{% if details %}
<details>
<summary><strong>{{ message | escape }}</strong> {{ self::reference(commit=commit, html=true) }}

{{ summary }}

</summary>

{{ details }}

</details>
{% else %}
- **{{ message | escape }}** {{ self::reference(commit=commit) }}
{% if summary %}

{{ summary | indent(prefix="  ", first=true) }}
{% endif %}
{% endif %}
{% for footer in commit.footers %}
{% if not footer.breaking and footer.token | lower not in ["security", "deprecated"] %}
  **{{ footer.token }}:** {% if footer.separator | trim == "#" %}#{% endif %}{{ footer.value | indent(prefix="  ", first=false) }}
{% endif %}
{% endfor %}

{% endfor %}
{% endif %}
{% endfor %}
{% set contributors = commits | map(attribute="remote.username") | unique | sort %}
{% if contributors | length > 0 %}
**Contributors:** {% for username in contributors %}[@{{ username }}](https://github.com/{{ username }}) {% endfor %}
{% endif %}
{% if version %}
{% if previous.version %}
[{{ version }}]: https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/compare/{{ previous.version }}...{{ version }}
{% else %}
[{{ version }}]: https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/releases/tag/{{ version }}
{% endif %}
{% endif %}
{% endif %}
"""
trim = true
format = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
tag_pattern = '^v[0-9]+\.[0-9]+\.[0-9]+$'
use_branch_tags = true
sort_commits = "oldest"
commit_parsers = [
  { message = '^feat', group = "Added" },
  { message = '^fix', group = "Fixed" },
  { message = '^perf', group = "Performance" },
  { message = '^docs', group = "Documentation" },
  { message = '.*', group = "Other changes" },
]
