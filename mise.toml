[tools]
node = "24.21.0"
actionlint = "1.7.12"

[tasks.setup]
description = "Install development dependencies"
run = "npm ci --ignore-scripts"
sources = ["package.json", "package-lock.json"]
outputs = ["node_modules/.package-lock.json"]

[tasks."lint:pr"]
description = "Validate a JSON PR record from standard input"
depends = ["setup"]
run = "node src/cli.js"

[tasks.test]
description = "Test PR validation and the packaged action"
depends = ["setup"]
run = "node --test test/validate.test.js"

[tasks.build]
description = "Bundle the action for GitHub"
depends = ["setup"]
run = "node scripts/build.js"

[tasks."check:bundle"]
description = "Verify that the committed action matches its source"
depends = ["setup"]
run = "node scripts/build.js --check"

[tasks.check]
description = "Test the validator, bundle and workflows"
depends = ["test", "check:bundle"]
run = "actionlint"
